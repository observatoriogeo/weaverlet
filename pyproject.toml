[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "weaverlet"
version = "0.3.1"
description = "Slim, server-side, component-driven framework on top of Plotly Dash."
dynamic = ["readme"]
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "Alberto Garcia-Robledo", email = "alberto.garob@gmail.com" },
]
keywords = ["dash", "plotly", "components", "dashboard", "framework"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "dash>=4.1.0,<5.0.0",
    "dash-extensions>=1.0.0,<3.0.0",
]

[project.optional-dependencies]
examples = [
    "dash-bootstrap-components>=2.0,<3.0",
    "dash-mantine-components>=2.0,<3.0",
]
dev = [
    "pytest>=8",
    "pytest-playwright>=0.5",
]

[project.urls]
Homepage = "https://weaverlet.observatoriogeo.mx"
Documentation = "https://weaverlet.observatoriogeo.mx"
Repository = "https://github.com/observatoriogeo/weaverlet"
Issues = "https://github.com/observatoriogeo/weaverlet/issues"
Changelog = "https://github.com/observatoriogeo/weaverlet/blob/main/CHANGELOG.md"

[tool.hatch.metadata.hooks.custom]
# README.md uses a relative image path so GitHub renders the logo with
# full transparency (GitHub bypasses its camo proxy for same-repo files).
# This hook rewrites the path to an absolute jsDelivr URL at build time
# so PyPI also renders it. See hatch_build.py.
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
include = [
    "weaverlet",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "hatch_build.py",
]

[tool.hatch.build.targets.wheel]
packages = ["weaverlet"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "browser: end-to-end test that boots a Dash app and drives Chromium via Playwright. Requires `playwright install chromium`. Skip with `-m 'not browser'`.",
]
filterwarnings = [
    # dash-extensions emits a DeprecationWarning about pkg_resources on import
    "ignore::DeprecationWarning:dash_extensions",
    "ignore::DeprecationWarning:pkg_resources",
]
